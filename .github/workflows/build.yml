          cat << 'EOF' > app/src/main/java/com/liteplay/ultralite/MediaItemModel.kt
          package com.liteplay.ultralite
          import android.net.Uri
          import java.util.Locale
          import java.util.concurrent.TimeUnit

          data class MediaItemModel(
              val id: Long, val uri: Uri, val title: String, val artistOrResolution: String,
              val durationMs: Long, val dateAddedSec: Long, val folderName: String, val isVideo: Boolean
          ) {
              fun formattedDuration(): String {
                  val s = TimeUnit.MILLISECONDS.toSeconds(durationMs)
                  return if (s / 3600 > 0) String.format(Locale.US, "%d:%02d:%02d", s / 3600, (s % 3600) / 60, s % 60)
                  else String.format(Locale.US, "%02d:%02d", (s % 3600) / 60, s % 60)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/liteplay/ultralite/PrefsManager.kt
          package com.liteplay.ultralite
          import android.content.Context
          object PrefsManager {
              private const val PREFS = "liteplay_prefs"
              fun isContinueAudioScreenOff(c: Context) = c.getSharedPreferences(PREFS, 0).getBoolean("screen_off", true)
              fun setContinueAudioScreenOff(c: Context, v: Boolean) = c.getSharedPreferences(PREFS, 0).edit().putBoolean("screen_off", v).apply()
              fun addRecentUri(c: Context, u: String) {
                  val list = getRecentUris(c).toMutableList().apply { remove(u); add(0, u) }.take(50).joinToString("|")
                  c.getSharedPreferences(PREFS, 0).edit().putString("recent", list).apply()
              }
              fun getRecentUris(c: Context): List<String> {
                  val r = c.getSharedPreferences(PREFS, 0).getString("recent", "") ?: ""
                  return if (r.isBlank()) emptyList() else r.split("|")
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/liteplay/ultralite/MediaRepository.kt
          package com.liteplay.ultralite
          import android.content.ContentUris
          import android.content.Context
          import android.provider.MediaStore

          object MediaRepository {
              private var cachedAudio: List<MediaItemModel>? = null
              private var cachedVideo: List<MediaItemModel>? = null

              fun getAudioFiles(context: Context, force: Boolean = false): List<MediaItemModel> {
                  if (!force && cachedAudio != null) return cachedAudio!!
                  val list = mutableListOf<MediaItemModel>()
                  val uri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                  val proj = arrayOf(MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.ARTIST, MediaStore.Audio.Media.DURATION, MediaStore.Audio.Media.DATE_ADDED, MediaStore.Audio.Media.BUCKET_DISPLAY_NAME)
                  context.contentResolver.query(uri, proj, "${MediaStore.Audio.Media.IS_MUSIC} != 0 AND ${MediaStore.Audio.Media.DURATION} > 0", null, null)?.use { c ->
                      while (c.moveToNext()) {
                          val id = c.getLong(0)
                          list.add(MediaItemModel(id, ContentUris.withAppendedId(uri, id), c.getString(1) ?: "Audio", c.getString(2) ?: "Unknown", c.getLong(3), c.getLong(4), c.getString(5) ?: "Music", false))
                      }
                  }
                  cachedAudio = list
                  return list
              }

              fun getVideoFiles(context: Context, force: Boolean = false): List<MediaItemModel> {
                  if (!force && cachedVideo != null) return cachedVideo!!
                  val list = mutableListOf<MediaItemModel>()
                  val uri = MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  val proj = arrayOf(MediaStore.Video.Media._ID, MediaStore.Video.Media.TITLE, MediaStore.Video.Media.RESOLUTION, MediaStore.Video.Media.DURATION, MediaStore.Video.Media.DATE_ADDED, MediaStore.Video.Media.BUCKET_DISPLAY_NAME)
                  context.contentResolver.query(uri, proj, "${MediaStore.Video.Media.DURATION} > 0", null, null)?.use { c ->
                      while (c.moveToNext()) {
                          val id = c.getLong(0)
                          list.add(MediaItemModel(id, ContentUris.withAppendedId(uri, id), c.getString(1) ?: "Video", c.getString(2) ?: "Video", c.getLong(3), c.getLong(4), c.getString(5) ?: "Videos", true))
                      }
                  }
                  cachedVideo = list
                  return list
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/liteplay/ultralite/PlaybackService.kt
          package com.liteplay.ultralite
          import android.app.PendingIntent
          import android.content.Intent
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          class PlaybackService : MediaSessionService() {
              companion object { var playerInstance: ExoPlayer? = null }
              private var mediaSession: MediaSession? = null

              override fun onCreate() {
                  super.onCreate()
                  val attr = AudioAttributes.Builder().setUsage(C.USAGE_MEDIA).setContentType(C.AUDIO_CONTENT_TYPE_MUSIC).build()
                  val player = ExoPlayer.Builder(this).setAudioAttributes(attr, true).setHandleAudioBecomingNoisy(true).setWakeMode(C.WAKE_MODE_LOCAL).build()
                  playerInstance = player
                  val pi = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  mediaSession = MediaSession.Builder(this, player).setSessionActivity(pi).build()
              }
              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo) = mediaSession
              override fun onDestroy() {
                  mediaSession?.run { player.release(); release(); mediaSession = null }
                  playerInstance = null
                  super.onDestroy()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/liteplay/ultralite/MediaAdapter.kt
          package com.liteplay.ultralite
          import android.content.Context
          import android.graphics.Bitmap
          import android.os.Handler
          import android.os.Looper
          import android.util.LruCache
          import android.util.Size
          import android.view.LayoutInflater
          import android.view.ViewGroup
          import androidx.recyclerview.widget.RecyclerView
          import com.liteplay.ultralite.databinding.ItemMediaBinding
          import java.util.concurrent.Executors

          sealed class ListEntry {
              data class MediaEntry(val item: MediaItemModel) : ListEntry()
              data class FolderEntry(val folderName: String, val count: Int) : ListEntry()
          }

          class MediaAdapter(
              private val context: Context,
              private val onMediaClick: (MediaItemModel, List<MediaItemModel>) -> Unit,
              private val onFolderClick: (String) -> Unit
          ) : RecyclerView.Adapter<MediaAdapter.ViewHolder>() {
              private val entries = mutableListOf<ListEntry>()
              private var currentMediaList: List<MediaItemModel> = emptyList()
              private val mainHandler = Handler(Looper.getMainLooper())
              private val thumbExecutor = Executors.newFixedThreadPool(2)
              private val thumbCache = object : LruCache<String, Bitmap>(4 * 1024) {
                  override fun sizeOf(key: String, value: Bitmap) = value.byteCount / 1024
              }

              fun submitMediaList(items: List<MediaItemModel>) {
                  currentMediaList = items; entries.clear(); entries.addAll(items.map { ListEntry.MediaEntry(it) }); notifyDataSetChanged()
              }
              fun submitFolders(folders: Map<String, Int>) {
                  entries.clear(); folders.entries.sortedBy { it.key.lowercase() }.forEach { entries.add(ListEntry.FolderEntry(it.key, it.value)) }; notifyDataSetChanged()
              }
              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int) = ViewHolder(ItemMediaBinding.inflate(LayoutInflater.from(parent.context), parent, false))
              override fun getItemCount() = entries.size
              override fun onBindViewHolder(holder: ViewHolder, position: Int) = holder.bind(entries[position])

              inner class ViewHolder(private val b: ItemMediaBinding) : RecyclerView.ViewHolder(b.root) {
                  fun bind(e: ListEntry) {
                      when (e) {
                          is ListEntry.FolderEntry -> {
                              b.itemTitle.text = e.folderName; b.itemSubtitle.text = "${e.count} files"; b.itemDuration.text = "Folder"
                              b.itemThumb.setImageResource(R.drawable.ic_media_note)
                              b.root.setOnClickListener { onFolderClick(e.folderName) }
                          }
                          is ListEntry.MediaEntry -> {
                              val m = e.item
                              b.itemTitle.text = m.title; b.itemSubtitle.text = m.artistOrResolution; b.itemDuration.text = m.formattedDuration()
                              val key = m.uri.toString(); b.itemThumb.tag = key
                              val cached = thumbCache.get(key)
                              if (cached != null) b.itemThumb.setImageBitmap(cached)
                              else {
                                  b.itemThumb.setImageResource(R.drawable.ic_media_note)
                                  thumbExecutor.execute {
                                      try {
                                          val bmp = context.contentResolver.loadThumbnail(m.uri, Size(96, 96), null)
                                          thumbCache.put(key, bmp)
                                          mainHandler.post { if (b.itemThumb.tag == key) b.itemThumb.setImageBitmap(bmp) }
                                      } catch (_: Exception) {}
                                  }
                              }
                              b.root.setOnClickListener { onMediaClick(m, currentMediaList) }
                          }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/liteplay/ultralite/MainActivity.kt
          package com.liteplay.ultralite
          import android.Manifest
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Menu
          import android.view.MenuItem
          import android.view.View
          import android.widget.SeekBar
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.common.Player
          import androidx.media3.session.MediaController
          import androidx.media3.session.SessionToken
          import androidx.recyclerview.widget.LinearLayoutManager
          import com.google.android.material.tabs.TabLayout
          import com.google.common.util.concurrent.ListenableFuture
          import com.google.common.util.concurrent.MoreExecutors
          import com.liteplay.ultralite.databinding.ActivityMainBinding
          import java.util.concurrent.Executors

          class MainActivity : AppCompatActivity() {
              private lateinit var binding: ActivityMainBinding
              private lateinit var adapter: MediaAdapter
              private var controllerFuture: ListenableFuture<MediaController>? = null
              private var mediaController: MediaController? = null
              private val bgExecutor = Executors.newSingleThreadExecutor()
              private val uiHandler = Handler(Looper.getMainLooper())
              private var currentSort = 0
              private var currentTab = 0
              private var selectedFolder: String? = null
              private var searchQuery = ""

              private val permLauncher = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { map ->
                  if (map.values.any { it }) { binding.permissionContainer.visibility = View.GONE; refreshList(true) }
                  else binding.permissionContainer.visibility = View.VISIBLE
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)
                  setSupportActionBar(binding.toolbar)

                  listOf("Music", "Videos", "Folders", "Recent").forEach { binding.tabLayout.addTab(binding.tabLayout.newTab().setText(it)) }
                  binding.tabLayout.addOnTabSelectedListener(object : TabLayout.OnTabSelectedListener {
                      override fun onTabSelected(t: TabLayout.Tab) { currentTab = t.position; selectedFolder = null; binding.folderBackBar.visibility = View.GONE; refreshList() }
                      override fun onTabUnselected(t: TabLayout.Tab) {}
                      override fun onTabReselected(t: TabLayout.Tab) {}
                  })
                  binding.btnBackFolder.setOnClickListener { selectedFolder = null; binding.folderBackBar.visibility = View.GONE; refreshList() }

                  adapter = MediaAdapter(this, { item, q -> playMedia(item, q) }, { f -> selectedFolder = f; binding.folderBackBar.visibility = View.VISIBLE; binding.txtCurrentFolder.text = f; refreshList() })
                  binding.recyclerView.layoutManager = LinearLayoutManager(this)
                  binding.recyclerView.adapter = adapter

                  binding.searchInput.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) { searchQuery = s?.toString()?.trim().orEmpty(); refreshList() }
                      override fun afterTextChanged(s: Editable?) {}
                  })
                  binding.btnGrantPermission.setOnClickListener { checkPerms() }
                  binding.btnPlayPause.setOnClickListener { mediaController?.let { if (it.isPlaying) it.pause() else it.play() } }
                  binding.btnPrev.setOnClickListener { mediaController?.seekToPreviousMediaItem() }
                  binding.btnNext.setOnClickListener { mediaController?.seekToNextMediaItem() }
                  binding.btnShuffle.setOnClickListener { mediaController?.let { it.shuffleModeEnabled = !it.shuffleModeEnabled; updateMini() } }
                  binding.btnRepeat.setOnClickListener { mediaController?.let { it.repeatMode = if (it.repeatMode == Player.REPEAT_MODE_OFF) Player.REPEAT_MODE_ALL else Player.REPEAT_MODE_OFF; updateMini() } }
                  binding.miniSeekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) { if (fromUser) mediaController?.seekTo(p * 1000L) }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  binding.miniInfoArea.setOnClickListener {
                      if (mediaController?.currentMediaItem?.mediaMetadata?.extras?.getBoolean("isVideo") == true) startActivity(Intent(this, VideoPlayerActivity::class.java))
                  }
                  checkPerms()
              }

              override fun onStart() {
                  super.onStart()
                  val token = SessionToken(this, ComponentName(this, PlaybackService::class.java))
                  controllerFuture = MediaController.Builder(this, token).buildAsync()
                  controllerFuture?.addListener({
                      mediaController = controllerFuture?.get()
                      mediaController?.addListener(object : Player.Listener {
                          override fun onEvents(player: Player, events: Player.Events) { updateMini() }
                      })
                      updateMini()
                  }, MoreExecutors.directExecutor())
              }

              override fun onStop() {
                  controllerFuture?.let { MediaController.releaseFuture(it) }
                  mediaController = null
                  super.onStop()
              }

              override fun onCreateOptionsMenu(menu: Menu): Boolean {
                  menuInflater.inflate(R.menu.main_menu, menu)
                  menu.findItem(R.id.action_screen_off_audio)?.isChecked = PrefsManager.isContinueAudioScreenOff(this)
                  return true
              }

              override fun onOptionsItemSelected(item: MenuItem): Boolean {
                  when (item.itemId) {
                      R.id.action_screen_off_audio -> { item.isChecked = !item.isChecked; PrefsManager.setContinueAudioScreenOff(this, item.isChecked) }
                      R.id.action_sort_title -> { currentSort = 0; refreshList() }
                      R.id.action_sort_date -> { currentSort = 1; refreshList() }
                      R.id.action_sort_duration -> { currentSort = 2; refreshList() }
                  }
                  return true
              }

              private fun checkPerms() {
                  val perms = if (Build.VERSION.SDK_INT >= 33) arrayOf(Manifest.permission.READ_MEDIA_AUDIO, Manifest.permission.READ_MEDIA_VIDEO)
                  else arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
                  if (perms.all { ContextCompat.checkSelfPermission(this, it) == PackageManager.PERMISSION_GRANTED }) {
                      binding.permissionContainer.visibility = View.GONE; refreshList(true)
                  } else permLauncher.launch(perms)
              }

              private fun refreshList(force: Boolean = false) {
                  bgExecutor.execute {
                      val a = MediaRepository.getAudioFiles(this, force)
                      val v = MediaRepository.getVideoFiles(this, force)
                      val all = a + v
                      if (currentTab == 2 && selectedFolder == null && searchQuery.isEmpty()) {
                          val map = all.groupingBy { it.folderName }.eachCount()
                          uiHandler.post { adapter.submitFolders(map) }
                          return@execute
                      }
                      val base = when (currentTab) {
                          0 -> a; 1 -> v; 2 -> all.filter { it.folderName == selectedFolder }
                          else -> { val byUri = all.associateBy { it.uri.toString() }; PrefsManager.getRecentUris(this).mapNotNull { byUri[it] } }
                      }
                      val filt = if (searchQuery.isEmpty()) base else base.filter { it.title.contains(searchQuery, true) }
                      val sort = when (currentSort) { 1 -> filt.sortedByDescending { it.dateAddedSec }; 2 -> filt.sortedByDescending { it.durationMs }; else -> filt.sortedBy { it.title.lowercase() } }
                      uiHandler.post { binding.emptyView.visibility = if (sort.isEmpty()) View.VISIBLE else View.GONE; adapter.submitMediaList(sort) }
                  }
              }

              private fun playMedia(sel: MediaItemModel, q: List<MediaItemModel>) {
                  PrefsManager.addRecentUri(this, sel.uri.toString())
                  val ctrl = mediaController ?: return
                  val items = q.map {
                      val ex = Bundle().apply { putBoolean("isVideo", it.isVideo) }
                      val meta = MediaMetadata.Builder().setTitle(it.title).setArtist(it.artistOrResolution).setExtras(ex).build()
                      MediaItem.Builder().setMediaId(it.uri.toString()).setUri(it.uri).setMediaMetadata(meta).build()
                  }
                  ctrl.setMediaItems(items, q.indexOfFirst { it.uri == sel.uri }.coerceAtLeast(0), 0L)
                  ctrl.prepare(); ctrl.play(); updateMini()
                  if (sel.isVideo) startActivity(Intent(this, VideoPlayerActivity::class.java))
              }

              private fun updateMini() {
                  val c = mediaController ?: return
                  val cur = c.currentMediaItem ?: run { binding.miniPlayer.visibility = View.GONE; return }
                  binding.miniPlayer.visibility = View.VISIBLE
                  binding.miniTitle.text = cur.mediaMetadata.title
                  binding.miniSubtitle.text = cur.mediaMetadata.artist
                  binding.btnPlayPause.text = if (c.isPlaying) "PAUSE" else "PLAY"
                  binding.miniSeekBar.max = (c.duration.coerceAtLeast(1L) / 1000).toInt()
                  binding.miniSeekBar.progress = (c.currentPosition.coerceAtLeast(0L) / 1000).toInt()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/liteplay/ultralite/VideoPlayerActivity.kt
          package com.liteplay.ultralite
          import android.content.pm.ActivityInfo
          import android.content.res.Configuration
          import android.media.AudioManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.widget.SeekBar
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.C
          import com.liteplay.ultralite.databinding.ActivityVideoPlayerBinding
          import java.util.Locale
          import java.util.concurrent.TimeUnit

          class VideoPlayerActivity : AppCompatActivity() {
              private lateinit var binding: ActivityVideoPlayerBinding
              private val uiHandler = Handler(Looper.getMainLooper())
              private val updater = object : Runnable {
                  override fun run() {
                      val p = PlaybackService.playerInstance ?: return
                      val d = p.duration.coerceAtLeast(1L); val pos = p.currentPosition.coerceAtLeast(0L)
                      binding.videoSeekBar.max = (d / 1000).toInt(); binding.videoSeekBar.progress = (pos / 1000).toInt()
                      binding.txtPosition.text = fmt(pos); binding.txtDuration.text = fmt(d)
                      uiHandler.postDelayed(this, 500L)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityVideoPlayerBinding.inflate(layoutInflater)
                  setContentView(binding.root)
                  val am = getSystemService(AUDIO_SERVICE) as AudioManager

                  binding.playerView.setOnClickListener { binding.controlsOverlay.visibility = if (binding.controlsOverlay.visibility == View.VISIBLE) View.GONE else View.VISIBLE }
                  binding.controlsOverlay.setOnClickListener { binding.controlsOverlay.visibility = View.GONE }
                  binding.btnCloseVideo.setOnClickListener { finish() }
                  binding.btnRotate.setOnClickListener {
                      requestedOrientation = if (resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE) ActivityInfo.SCREEN_ORIENTATION_PORTRAIT else ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                  }
                  binding.btnVideoPlayPause.setOnClickListener {
                      PlaybackService.playerInstance?.let { if (it.isPlaying) it.pause() else it.play(); binding.btnVideoPlayPause.text = if (it.isPlaying) "PAUSE" else "PLAY" }
                  }
                  binding.brightnessSeek.progress = 50
                  binding.brightnessSeek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) { if (u) window.attributes = window.attributes.apply { screenBrightness = p.coerceAtLeast(5) / 100f } }
                      override fun onStartTrackingTouch(s: SeekBar?) {}; override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  binding.volumeSeek.max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                  binding.volumeSeek.progress = am.getStreamVolume(AudioManager.STREAM_MUSIC)
                  binding.volumeSeek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) { if (u) am.setStreamVolume(AudioManager.STREAM_MUSIC, p, 0) }
                      override fun onStartTrackingTouch(s: SeekBar?) {}; override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  binding.videoSeekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) { if (u) PlaybackService.playerInstance?.seekTo(p * 1000L) }
                      override fun onStartTrackingTouch(s: SeekBar?) {}; override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
              }

              override fun onStart() {
                  super.onStart()
                  val p = PlaybackService.playerInstance ?: run { finish(); return }
                  p.trackSelectionParameters = p.trackSelectionParameters.buildUpon().setTrackTypeDisabled(C.TRACK_TYPE_VIDEO, false).build()
                  binding.playerView.player = p
                  binding.videoTitle.text = p.currentMediaItem?.mediaMetadata?.title ?: "Video"
                  uiHandler.post(updater)
              }

              override fun onStop() {
                  uiHandler.removeCallbacks(updater)
                  val p = PlaybackService.playerInstance
                  binding.playerView.player = null
                  p?.clearVideoSurface()
                  if (p != null) {
                      if (PrefsManager.isContinueAudioScreenOff(this) && !isFinishing) {
                          p.trackSelectionParameters = p.trackSelectionParameters.buildUpon().setTrackTypeDisabled(C.TRACK_TYPE_VIDEO, true).build()
                      } else if (!PrefsManager.isContinueAudioScreenOff(this)) p.pause()
                  }
                  super.onStop()
              }

              private fun fmt(ms: Long): String {
                  val s = TimeUnit.MILLISECONDS.toSeconds(ms)
                  return String.format(Locale.US, "%02d:%02d", (s % 3600) / 60, s % 60)
              }
          }
